# Semgrep rules for CakePHP 2 applications (pieceofcake2/security-sast)
rules:
  - id: cakephp2-query-concatenation
    languages: [php]
    severity: ERROR
    message: >-
      SQL built from a string with a variable is passed to Model::query() (or fetchAll(), execute()). Use the
      values array of query()
      ($this->Model->query('... WHERE id = ?', [$id])) or find() with conditions arrays.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $M->query($V, ...)
              # The methods of the datasource, e.g. $this->Post->getDataSource()->fetchAll($sql)
              - pattern: $M->fetchAll($V, ...)
              - pattern: $M->execute($V, ...)
          - pattern-not: $this->request->query(...)
          # A concatenation with a value that is not a string literal, as the value itself (not in a call)
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern: $A . $B
                - pattern-not-inside: $F(...)
                - pattern-not-inside: $O->$F(...)
                - pattern-not-inside: $C::$F(...)
                - pattern-not-inside: '[...]'
          # Not an item with a key, and not of string literals only
          - metavariable-regex:
              metavariable: $V
              regex: '\A(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")\s*=>)(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\$]|\\.|\$(?![A-Za-z_{]))*"|\d+(?:\.\d+)?)(?:\s*\.\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\$]|\\.|\$(?![A-Za-z_{]))*"|\d+(?:\.\d+)?))*\s*\z)'
      - patterns:
          - pattern-either:
              - pattern: $M->query($V, ...)
              # The methods of the datasource, e.g. $this->Post->getDataSource()->fetchAll($sql)
              - pattern: $M->fetchAll($V, ...)
              - pattern: $M->execute($V, ...)
          - pattern-not: $this->request->query(...)
          # A double-quoted string or a heredoc with a variable in it, not an item with a key
          - metavariable-regex:
              metavariable: $V
              regex: '\A(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")\s*=>)(?:"(?:[^"\\]|\\.)*\$[A-Za-z_{]|<<<[ \t]*"?[A-Za-z_]\w*"?\R[\s\S]*?\$[A-Za-z_{])'
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM

  - id: cakephp2-conditions-string
    languages: [php]
    severity: ERROR
    message: >-
      A conditions string with a variable is passed to find(), deleteAll(), updateAll(), field() or hasAny(), or as a
      value of the fields of updateAll(). Use a conditions array (['Post.title' => $title]) so that the value is
      escaped.
    pattern-either:
      - patterns:
          - pattern-either:
              # In any place of the options, e.g. after 'recursive'
              - pattern: "[..., 'conditions' => $V, ...]"
              - pattern: "[..., 'conditions' => [..., $V, ...], ...]"
              - pattern: $M->deleteAll($V, ...)
              - pattern: $M->updateAll($FIELDS, $V, ...)
              - pattern: $M->field($NAME, $V, ...)
              - pattern: $M->hasAny($V, ...)
              # The fields of updateAll() are SQL too
              - pattern: $M->updateAll([..., $FIELD => $V, ...], ...)
          # A concatenation with a value that is not a string literal, as the value itself (not in a call)
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern: $A . $B
                - pattern-not-inside: $F(...)
                - pattern-not-inside: $O->$F(...)
                - pattern-not-inside: $C::$F(...)
                - pattern-not-inside: '[...]'
          # Not an item with a key, and not of string literals only
          - metavariable-regex:
              metavariable: $V
              regex: '\A(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")\s*=>)(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\$]|\\.|\$(?![A-Za-z_{]))*"|\d+(?:\.\d+)?)(?:\s*\.\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\$]|\\.|\$(?![A-Za-z_{]))*"|\d+(?:\.\d+)?))*\s*\z)'
      - patterns:
          - pattern-either:
              # In any place of the options, e.g. after 'recursive'
              - pattern: "[..., 'conditions' => $V, ...]"
              - pattern: "[..., 'conditions' => [..., $V, ...], ...]"
              - pattern: $M->deleteAll($V, ...)
              - pattern: $M->updateAll($FIELDS, $V, ...)
              - pattern: $M->field($NAME, $V, ...)
              - pattern: $M->hasAny($V, ...)
              # The fields of updateAll() are SQL too
              - pattern: $M->updateAll([..., $FIELD => $V, ...], ...)
          # A double-quoted string or a heredoc with a variable in it, not an item with a key
          - metavariable-regex:
              metavariable: $V
              regex: '\A(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")\s*=>)(?:"(?:[^"\\]|\\.)*\$[A-Za-z_{]|<<<[ \t]*"?[A-Za-z_]\w*"?\R[\s\S]*?\$[A-Za-z_{])'
      # The conditions of OR, AND, NOT and XOR in the conditions
      - patterns:
          - pattern: "[..., 'conditions' => [..., $LOGIC => [..., $V, ...], ...], ...]"
          - metavariable-regex:
              metavariable: $LOGIC
              regex: '\A[''"](?i:or|and|not|xor)[''"]\z'
          # A concatenation with a value that is not a string literal, as the value itself (not in a call)
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern: $A . $B
                - pattern-not-inside: $F(...)
                - pattern-not-inside: $O->$F(...)
                - pattern-not-inside: $C::$F(...)
                - pattern-not-inside: '[...]'
          # Not an item with a key, and not of string literals only
          - metavariable-regex:
              metavariable: $V
              regex: '\A(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")\s*=>)(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\$]|\\.|\$(?![A-Za-z_{]))*"|\d+(?:\.\d+)?)(?:\s*\.\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\$]|\\.|\$(?![A-Za-z_{]))*"|\d+(?:\.\d+)?))*\s*\z)'
      - patterns:
          - pattern: "[..., 'conditions' => [..., $LOGIC => [..., $V, ...], ...], ...]"
          - metavariable-regex:
              metavariable: $LOGIC
              regex: '\A[''"](?i:or|and|not|xor)[''"]\z'
          # A double-quoted string or a heredoc with a variable in it, not an item with a key
          - metavariable-regex:
              metavariable: $V
              regex: '\A(?!\s*(?:''(?:[^''\\]|\\.)*''|"(?:[^"\\]|\\.)*")\s*=>)(?:"(?:[^"\\]|\\.)*\$[A-Za-z_{]|<<<[ \t]*"?[A-Za-z_]\w*"?\R[\s\S]*?\$[A-Za-z_{])'
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM

  - id: cakephp2-order-request
    languages: [php]
    severity: ERROR
    message: >-
      A value of the request is the order, fields or group of find() or paginate: it goes into the SQL as a name.
      Map the value to a list of allowed fields.
    patterns:
      - pattern: "[..., $OPTION => $V, ...]"
      - metavariable-regex:
          metavariable: $OPTION
          regex: '\A[''"](?:order|fields|group)[''"]\z'
      - metavariable-pattern:
          metavariable: $V
          patterns:
            - pattern-either:
                - pattern: <... $this->request ...>
                - pattern: <... $_GET ...>
                - pattern: <... $_POST ...>
                - pattern: <... $_REQUEST ...>
                - pattern: <... $_COOKIE ...>
                - pattern: <... $_FILES ...>
            # A lookup in a list of allowed values
            - pattern-not: $LIST[...] ?? $DEFAULT
            - pattern-not: $LIST[...]
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: MEDIUM

  - id: cakephp2-redirect-request
    languages: [php]
    severity: WARNING
    message: >-
      A value of the request is passed to redirect(). Redirect only to paths of the application, e.g. with
      Router::url() of a route array, or check the URL against a list.
    # The values of the request, as PHPStan finds them: $this->request and the superglobals of the request
    patterns:
      - pattern-either:
          - pattern: $this->redirect(<... $this->request ...>, ...)
          - pattern: $this->redirect(<... $_GET ...>, ...)
          - pattern: $this->redirect(<... $_POST ...>, ...)
          - pattern: $this->redirect(<... $_REQUEST ...>, ...)
          - pattern: $this->redirect(<... $_COOKIE ...>, ...)
          - pattern: $this->redirect(<... $_FILES ...>, ...)
      # A route array is a URL of the application, whatever the values of the request in it
      - pattern-not: $this->redirect([...], ...)
    metadata:
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: HIGH

  - id: cakephp2-render-request
    languages: [php]
    severity: ERROR
    message: >-
      A value of the request is passed to render() or element(). A path in it can render any template. Map the
      value to a list of allowed views.
    # The values of the request, as PHPStan finds them: $this->request and the superglobals of the request
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $this->render(<... $this->request ...>, ...)
              - pattern: $this->render(<... $_GET ...>, ...)
              - pattern: $this->render(<... $_POST ...>, ...)
              - pattern: $this->render(<... $_REQUEST ...>, ...)
              - pattern: $this->render(<... $_COOKIE ...>, ...)
              - pattern: $this->render(<... $_FILES ...>, ...)
              - pattern: $this->element(<... $this->request ...>, ...)
              - pattern: $this->element(<... $_GET ...>, ...)
              - pattern: $this->element(<... $_POST ...>, ...)
              - pattern: $this->element(<... $_REQUEST ...>, ...)
              - pattern: $this->element(<... $_COOKIE ...>, ...)
              - pattern: $this->element(<... $_FILES ...>, ...)
          # A ternary that only checks the request, e.g. is('ajax'), chooses between views of the code
          - pattern-not: "$this->render($C ? $A : $B, ...)"
          - pattern-not: "$this->element($C ? $A : $B, ...)"
      - patterns:
          - pattern-either:
              - pattern: "$this->render($C ? $A : $B, ...)"
              - pattern: "$this->element($C ? $A : $B, ...)"
          - metavariable-pattern:
              metavariable: $A
              pattern-either:
                  - pattern: <... $this->request ...>
                  - pattern: <... $_GET ...>
                  - pattern: <... $_POST ...>
                  - pattern: <... $_REQUEST ...>
                  - pattern: <... $_COOKIE ...>
                  - pattern: <... $_FILES ...>
      - patterns:
          - pattern-either:
              - pattern: "$this->render($C ? $A : $B, ...)"
              - pattern: "$this->element($C ? $A : $B, ...)"
          - metavariable-pattern:
              metavariable: $B
              pattern-either:
                  - pattern: <... $this->request ...>
                  - pattern: <... $_GET ...>
                  - pattern: <... $_POST ...>
                  - pattern: <... $_REQUEST ...>
                  - pattern: <... $_COOKIE ...>
                  - pattern: <... $_FILES ...>
    metadata:
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: HIGH

  - id: cakephp2-xml-build-variable
    languages: [php]
    severity: WARNING
    message: >-
      Xml::build() is called with a variable: a URL or a path in it is read. Pass ['readFile' => false] for a
      string of XML, and do not pass values of the request.
    patterns:
      - pattern: Xml::build($X, ...)
      - pattern-not: Xml::build("...", ...)
      - pattern-not: Xml::build($X, [..., 'readFile' => false, ...])
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      category: security
      confidence: MEDIUM

  - id: cakephp2-unserialize-request
    languages: [php]
    severity: ERROR
    message: >-
      A value of the request is passed to unserialize(): it can create objects of any class. Use json_decode().
    # The values of the request, as PHPStan finds them: $this->request and the superglobals of the request
    pattern-either:
      - pattern: unserialize(<... $this->request ...>, ...)
      - pattern: unserialize(<... $_GET ...>, ...)
      - pattern: unserialize(<... $_POST ...>, ...)
      - pattern: unserialize(<... $_REQUEST ...>, ...)
      - pattern: unserialize(<... $_COOKIE ...>, ...)
      - pattern: unserialize(<... $_FILES ...>, ...)
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      category: security
      confidence: HIGH

  - id: cakephp2-security-csrf-disabled
    languages: [php]
    severity: WARNING
    message: >-
      The CSRF check or the form tampering check of SecurityComponent is turned off. Turn it off only for the
      actions that need it, e.g. with unlockedActions.
    pattern-either:
      - pattern: $this->Security->csrfCheck = false;
      - pattern: $this->Security->validatePost = false;
      # In the settings of the component
      - pattern: "[..., 'Security' => [..., 'csrfCheck' => false, ...], ...]"
      - pattern: "[..., 'Security' => [..., 'validatePost' => false, ...], ...]"
    metadata:
      cwe: ["CWE-352: Cross-Site Request Forgery (CSRF)"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      confidence: MEDIUM

  - id: cakephp2-view-raw-output
    languages: [php]
    severity: INFO
    message: >-
      HTML is printed without escaping on purpose with raw(). Check that it is built by the application or
      sanitized, never a value of the request.
    pattern: echo raw(...);
    paths:
      include:
        - "**/templates/**/*.ctp"
        - "**/View/**/*.ctp"
      # The text mails are not HTML
      exclude:
        - "**/Emails/text/**"
        # The classes of the directories of views: the helpers, and the views, e.g. View/AppView.php
        - "**/View/Helper/**"
        - "**/View/*View.php"
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: LOW

  - id: cakephp2-view-unescaped-output
    languages: [php]
    severity: WARNING
    message: >-
      A variable is printed in a view without h(). Escape it with h(), or use a helper that escapes.
    pattern-either:
      - patterns:
          - pattern: echo $X;
          # A variable, with its keys and properties, printed as it is; not $this, a call or the HTML variables of
          # the layouts. SecuritySast\SemgrepEngine adds the safe variables of the settings to the names.
          - metavariable-regex:
              metavariable: $X
              regex: '\A\$(?!this\b)(?!(?:content_for_layout|scripts_for_layout)\b)[A-Za-z_]\w*(?:\[(?:[^\[\]]|\[[^\]]*\])*\]|->\w+)*\z'
          # A variable that holds the output of a helper, an escaped value or a number
          - pattern-not-inside: |
              $X = $this->$HELPER->$METHOD(...);
              ...
          - pattern-not-inside: |
              $X = h(...);
              ...
          # Escaped unless an option says not to, as the Flash elements of CakePHP do
          - pattern-not-inside: |
              if (...) { ... $X = h(...); ... }
              ...
          - pattern-not-inside: |
              $X = count(...);
              ...
          # A string literal, or a translation of string literals only
          - pattern-not-inside: |
              $X = '...';
              ...
          - pattern-not-inside: |
              $X = __('...');
              ...
          - pattern-not-inside: |
              $X = __d('...', '...');
              ...
          - pattern-not-inside: |
              $X = __x('...', '...');
              ...
          - pattern-not-inside: |
              $X = __dx('...', '...', '...');
              ...
          - pattern-not-inside: |
              $X = (int)$Y;
              ...
          - pattern-not-inside: |
              $X = (float)$Y;
              ...
      # A value of the request or of the session, which is not the output of a helper: printed as it is, or through
      # a variable set to it
      - patterns:
          - pattern: echo $E;
          - metavariable-regex:
              metavariable: $E
              regex: '\A\$this->(?:(?:request|data|params|passedArgs)\b|Session->read\()'
      - patterns:
          - pattern: echo $X;
          - metavariable-regex:
              metavariable: $X
              regex: '\A\$(?!this\b)(?!(?:content_for_layout|scripts_for_layout)\b)[A-Za-z_]\w*(?:\[(?:[^\[\]]|\[[^\]]*\])*\]|->\w+)*\z'
          - pattern-inside: |
              $X = $Y;
              ...
          - metavariable-regex:
              metavariable: $Y
              regex: '\A\$this->(?:(?:request|data|params|passedArgs)\b|Session->read\()'
          - pattern-not-inside: |
              $X = h(...);
              ...
      # A variable set to a string literal, then to another value, as PHPStan takes the last assignment
      - patterns:
          - pattern: echo $X;
          - metavariable-regex:
              metavariable: $X
              regex: '\A\$(?!this\b)(?!(?:content_for_layout|scripts_for_layout)\b)[A-Za-z_]\w*(?:\[(?:[^\[\]]|\[[^\]]*\])*\]|->\w+)*\z'
          - pattern-inside: |
              $X = '...';
              ...
              $X = $Y;
              ...
          - metavariable-pattern:
              metavariable: $Y
              patterns:
                - pattern: $Z
                - pattern-not: "'...'"
                - pattern-not: h(...)
                - pattern-not: count(...)
                - pattern-not: (int)$W
                - pattern-not: (float)$W
                - pattern-not: $this->$HELPER->$METHOD(...)
    paths:
      include:
        - "**/templates/**/*.ctp"
        - "**/View/**/*.ctp"
      # The text mails are not HTML
      exclude:
        - "**/Emails/text/**"
        # The classes of the directories of views: the helpers, and the views, e.g. View/AppView.php
        - "**/View/Helper/**"
        - "**/View/*View.php"
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      category: security
      confidence: LOW
